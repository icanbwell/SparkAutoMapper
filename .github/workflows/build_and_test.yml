name: Build and Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # required for the OIDC token used to assume the ECR pull role below
      id-token: write

    steps:
      - uses: actions/checkout@v3
        with:
          # This workflow only reads the tree; it never pushes back to the repo.
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: pre-commit
        run: make run-pre-commit

      # spark.Dockerfile now pulls its base image from the private services ECR
      # (856965016623) per CIE-8032, so `make up` / `make tests` below need an
      # ECR login first. (`make run-pre-commit` does not - pre-commit.Dockerfile
      # stays on Docker Hub's python:3.12-slim.)
      #
      # !! NOT YET FUNCTIONAL - REQUIRES A HUMAN TO PROVISION AUTH !!
      # helix.pipelines does this from an in-account runner (label `main`) plus
      # role
      # arn:aws:iam::856965016623:role/services-k8s-service-account-github-actions-runner.
      # That pattern is NOT available here: this repo is PUBLIC and runs on
      # ubuntu-latest, so it has no ambient AWS identity. Until one of the
      # following is provisioned, this job cannot pull the base image:
      #   (a) an IAM OIDC trust policy in account 856965016623 that permits
      #       token.actions.githubusercontent.com to assume an ECR-pull-only
      #       role from repo:icanbwell/SparkAutoMapper, and the role ARN set in
      #       the repo variable AWS_ECR_PULL_ROLE_ARN; or
      #   (b) moving this job to the in-account runner (but note that a public
      #       repo using in-account runners lets fork PRs execute inside the AWS
      #       account - GitHub explicitly advises against that).
      - name: AWS Credentials (services account, for base image pulls)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4 (2025-08-04)
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_SERVICES_ECR_ROLE_ARN }}
          role-session-name: ${{ github.run_id }}-services

      - name: Login to Amazon ECR (services)
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2 (2026-08-19)

      # setup and install everything and run tests
      - name: up
        run: make up
      - name: tests
        run: make tests
